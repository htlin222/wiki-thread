<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <rect width="640" height="300" fill="#16181c"/>
  <!-- left channel: the word -->
  <rect x="40" y="70" width="240" height="160" rx="16" fill="#1f2937" stroke="#374151"/>
  <text x="160" y="135" font-family="system-ui,sans-serif" font-size="20" fill="#8b98a5" text-anchor="middle">verbal channel</text>
  <text x="160" y="180" font-family="ui-monospace,monospace" font-size="34" font-weight="700" fill="#f3f5f7" text-anchor="middle">"sun"</text>
  <!-- right channel: the picture -->
  <rect x="360" y="70" width="240" height="160" rx="16" fill="#1f2937" stroke="#374151"/>
  <text x="480" y="135" font-family="system-ui,sans-serif" font-size="20" fill="#8b98a5" text-anchor="middle">visual channel</text>
  <circle cx="480" cy="180" r="26" fill="#fbbf24"/>
  <g stroke="#fbbf24" stroke-width="4" stroke-linecap="round">
    <line x1="480" y1="138" x2="480" y2="146"/><line x1="480" y1="214" x2="480" y2="222"/>
    <line x1="438" y1="180" x2="446" y2="180"/><line x1="514" y1="180" x2="522" y2="180"/>
    <line x1="450" y1="150" x2="456" y2="156"/><line x1="504" y1="204" x2="510" y2="210"/>
    <line x1="510" y1="150" x2="504" y2="156"/><line x1="456" y1="204" x2="450" y2="210"/>
  </g>
  <!-- merge arrows -->
  <path d="M280 150 L360 150" stroke="#5cc0ff" stroke-width="3" fill="none" stroke-dasharray="2 8" stroke-linecap="round"/>
  <text x="320" y="270" font-family="system-ui,sans-serif" font-size="16" fill="#5cc0ff" text-anchor="middle">two hooks → one durable memory</text>
</svg>
